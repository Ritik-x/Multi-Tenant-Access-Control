services:
  api:
    build: .
    container_name: team_access_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17
    container_name: team_access_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 141117
      POSTGRES_DB: team_access_control
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d team_access_control"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: team_access_redis
    ports:
      - "6379:6379"
      healthcheck:
  test: ["CMD", "redis-cli", "ping"]
  interval: 5s
  timeout: 3s
  retries: 5

volumes:
  postgres_data:
